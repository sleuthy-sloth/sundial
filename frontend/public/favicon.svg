<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="sundial">
  <!-- The app's own mark, in vector: a dial with the gnomon's shadow filled. Follows the
       reader's colour scheme, like the app does, so it reads on light and dark chrome. -->
  <style>
    .ground { fill: #f4f1e8; }
    .mark { stroke: #25231f; }
    .wedge { fill: #d9822b; }
    @media (prefers-color-scheme: dark) {
      .ground { fill: #25231f; }
      .mark { stroke: #f4f1e8; }
    }
  </style>
  <rect class="ground" width="100" height="100" rx="18.0"/>
  <path class="wedge" d="M 50.0 50.0 L 17.75 50.00 A 32.25 32.25 0 0 1 33.88 22.07 Z"/>
  <g class="mark" fill="none" stroke-width="3.50">
    <circle cx="50.0" cy="50.0" r="32.25"/>
    <g stroke-width="1.80"><line x1="50.00" y1="12.50" x2="50.00" y2="7.50"/><line x1="68.75" y1="17.52" x2="71.25" y2="13.19"/><line x1="82.48" y1="31.25" x2="86.81" y2="28.75"/><line x1="87.50" y1="50.00" x2="92.50" y2="50.00"/><line x1="82.48" y1="68.75" x2="86.81" y2="71.25"/><line x1="68.75" y1="82.48" x2="71.25" y2="86.81"/><line x1="50.00" y1="87.50" x2="50.00" y2="92.50"/><line x1="31.25" y1="82.48" x2="28.75" y2="86.81"/><line x1="17.52" y1="68.75" x2="13.19" y2="71.25"/><line x1="12.50" y1="50.00" x2="7.50" y2="50.00"/><line x1="17.52" y1="31.25" x2="13.19" y2="28.75"/><line x1="31.25" y1="17.52" x2="28.75" y2="13.19"/></g>
  </g>
  <circle class="mark" cx="50.0" cy="50.0" r="2.80" fill="currentColor"/>
</svg>
