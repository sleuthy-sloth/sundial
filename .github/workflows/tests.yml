name: tests

on:
  push:
  pull_request:

jobs:
  api:
    name: API and calendar rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m pytest -q
        working-directory: backend

      # The release path: a fresh database, an upgrade with plans already in it, and a
      # restore from a copy. Cheap enough to run on every push, and the only place the
      # migrations are exercised as the service actually runs them.
      - run: python scripts/smoke_release.py
        env:
          PYTHONPATH: ""

      # The artwork and the app icon are committed, so Pillow is not a runtime dependency and
      # never runs on the Pi. These checks are the point: a derivative that has drifted out of
      # its budget, an illustration that no longer matches its page colour, or a maskable icon
      # that Android's crop would cut, fails here instead of on someone's phone.
      - run: pip install -r scripts/requirements-art.txt
      - run: python scripts/make_art.py --check
      - run: python scripts/make_icons.py --check

      # A unit that does not parse fails on the host at the worst moment and is invisible
      # from here. `verify` also insists the ExecStart binary exists, which it does not in
      # CI, so the unit is checked as syntax with those paths rewritten. It prints errors
      # and still exits 0, so this asserts on the output rather than the exit status.
      - name: the systemd unit parses
        run: |
          mkdir -p "$RUNNER_TEMP/sundial-clone"
          sed -e 's|%h/repos/sundial/backend/.venv/bin/uvicorn|/bin/true|' \
              -e "s|%h/repos/sundial|$RUNNER_TEMP/sundial-clone|g" \
              deploy/sundial.service > "$RUNNER_TEMP/verify-sundial.service"
          out=$(systemd-analyze verify "$RUNNER_TEMP/verify-sundial.service" 2>&1 || true)
          if [ -n "$out" ]; then
            echo "$out" >&2
            exit 1
          fi
          echo "deploy/sundial.service parses"

  interface:
    name: Browser checks
    runs-on: ubuntu-latest
    env:
      # One of the checks types a credential and the server writes it to a file. Pointed
      # outside the checkout so it can never be mistaken for a real one — and the suite fails
      # rather than running that check if it is not told where the file is.
      SUNDIAL_ICLOUD_ENV: ${{ runner.temp }}/icloud.env
      SUNDIAL_CHECK_ICLOUD_ENV: ${{ runner.temp }}/icloud.env
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements.txt
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

      # The checks drive the real app over HTTP, so bring it up first and wait for
      # it to answer rather than guessing at a sleep.
      - name: start the app
        working-directory: backend
        run: |
          python -m uvicorn app:app --host 127.0.0.1 --port 6770 &
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:6770/api/health > /dev/null; then
              echo "the app is answering"
              exit 0
            fi
            sleep 1
          done
          echo "the app never answered" >&2
          exit 1

      - run: npm run check:ui -- http://127.0.0.1:6770
        working-directory: frontend
